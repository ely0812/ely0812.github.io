<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <rect width="600" height="600" fill="#FFF4E0"/>
  <!-- mane -->
  <g transform="translate(300 290)">
    <g fill="#E8892B">
      <circle r="205"/>
    </g>
    <g fill="#D9731A">
      <path d="M0-215 L38-150 L-38-150Z"/><path d="M0-215 L38-150 L-38-150Z" transform="rotate(30)"/>
      <path d="M0-215 L38-150 L-38-150Z" transform="rotate(60)"/><path d="M0-215 L38-150 L-38-150Z" transform="rotate(90)"/>
      <path d="M0-215 L38-150 L-38-150Z" transform="rotate(120)"/><path d="M0-215 L38-150 L-38-150Z" transform="rotate(150)"/>
      <path d="M0-215 L38-150 L-38-150Z" transform="rotate(180)"/><path d="M0-215 L38-150 L-38-150Z" transform="rotate(210)"/>
      <path d="M0-215 L38-150 L-38-150Z" transform="rotate(240)"/><path d="M0-215 L38-150 L-38-150Z" transform="rotate(270)"/>
      <path d="M0-215 L38-150 L-38-150Z" transform="rotate(300)"/><path d="M0-215 L38-150 L-38-150Z" transform="rotate(330)"/>
    </g>
    <!-- ears -->
    <circle cx="-95" cy="-100" r="38" fill="#F6C46A"/><circle cx="95" cy="-100" r="38" fill="#F6C46A"/>
    <circle cx="-95" cy="-100" r="18" fill="#E8892B"/><circle cx="95" cy="-100" r="18" fill="#E8892B"/>
    <!-- face -->
    <ellipse cx="0" cy="10" rx="135" ry="128" fill="#F6C46A"/>
    <!-- eyes -->
    <circle cx="-48" cy="-15" r="14" fill="#3A2A1A"/><circle cx="48" cy="-15" r="14" fill="#3A2A1A"/>
    <circle cx="-43" cy="-20" r="4.5" fill="#fff"/><circle cx="53" cy="-20" r="4.5" fill="#fff"/>
    <!-- muzzle -->
    <ellipse cx="0" cy="60" rx="70" ry="50" fill="#FFF1D6"/>
    <path d="M-22 38 Q0 25 22 38 Q12 58 0 60 Q-12 58 -22 38Z" fill="#5A3A22"/>
    <path d="M0 60 L0 78 M0 78 Q-22 96 -38 82 M0 78 Q22 96 38 82" stroke="#5A3A22" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
  <!-- price tag with down arrow -->
  <g transform="translate(445 445) rotate(-12)">
    <path d="M-62 -48 H50 L82 0 L50 48 H-62 Z" fill="#E11D48"/>
    <circle cx="56" cy="0" r="9" fill="#FFF4E0"/>
    <path d="M-30 -24 V12 M-30 26 L-48 6 M-30 26 L-12 6" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="22" y="14" font-family="Apple SD Gothic Neo, sans-serif" font-size="38" font-weight="800" fill="#fff" text-anchor="middle">%</text>
  </g>
</svg>
